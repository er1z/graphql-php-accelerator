name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  create-draft-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-tags: 'true'
          ref: ${{ github.ref }}

      - name: Create draft release (idempotent)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ github.ref_name }}" 2>/dev/null \
            || gh release create "${{ github.ref_name }}" \
                 --title "${{ github.ref_name }}" \
                 --draft \
                 --notes-from-tag

  add-pie-binaries:
    needs: create-draft-release
    runs-on: ${{ matrix.operating-system }}
    continue-on-error: ${{ matrix.php-versions == '8.1' || matrix.php-versions == '8.5' }}
    strategy:
      fail-fast: false
      matrix:
        operating-system:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - macos-latest
        php-versions:
          - '8.1'
          - '8.2'
          - '8.3'
          - '8.4'
          - '8.5'
        zts-mode:
          - nts
          - ts
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-versions }}
        env:
          phpts: ${{ matrix.zts-mode }}

      - name: Build and upload binary
        uses: php/pie-ext-binary-builder@0.0.2
        with:
          release-tag: ${{ github.ref_name }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
